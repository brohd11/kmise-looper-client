# Custom (not rendered from sh-templates): gousb needs cgo, which can't cross-compile from one
# runner, so each platform builds natively with a static libusb. Asset names and the
# release-notes/publish steps match sh-templates/go/templates/release.template.yml, so the
# rendered install.sh / install.ps1 work unchanged.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,    goos: linux,   goarch: amd64, shell: bash }
          - { os: ubuntu-24.04-arm, goos: linux,   goarch: arm64, shell: bash }
          - { os: macos-latest,     goos: darwin,  goarch: arm64, shell: bash }
          - { os: macos-latest,     goos: darwin,  goarch: amd64, shell: bash, cc: clang -arch x86_64 }
          - { os: windows-latest,   goos: windows, goarch: amd64, shell: 'msys2 {0}', ext: .exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      GOARCH: ${{ matrix.goarch }}
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The makefile stamps the version from git describe.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            make zip bzip2 diffutils mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf

      - name: Build static libusb
        run: |
          [ -n "$CC" ] || unset CC
          bash scripts/build-libusb.sh "$RUNNER_TEMP/libusb"

      - name: Build
        run: |
          [ -n "$CC" ] || unset CC
          make build

      # Same flat, version-less archive the makefile's package target would produce.
      - name: Package
        run: |
          set -euo pipefail
          name=kmise-${{ matrix.goos }}-${{ matrix.goarch }}
          dir=build/${{ matrix.goos }}-${{ matrix.goarch }}
          if [ -n "${{ matrix.ext }}" ]; then mv "$dir/kmise" "$dir/kmise${{ matrix.ext }}"; fi
          mkdir -p dist
          (cd "$dir" && zip -q -j "../../dist/$name.zip" "kmise${{ matrix.ext }}")
          case "${{ matrix.goos }}" in
            linux)  ! ldd "$dir/kmise" | grep -i libusb ;;
            darwin) ! otool -L "$dir/kmise" | grep -i libusb ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: kmise-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version stamping and release notes need tags and full history.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # ---- from sh-templates/go/templates/release.template.yml ----
      # Tags with a -PRERELEASE suffix (e.g. v0.1.0-alpha.1) publish as prereleases.
      # Prereleases cover changes since the previous tag. Full releases cover changes since the
      # previous full release, folding in any prereleases between (git-cliff's --current can't).
      - name: Select release notes range
        id: range
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            prerelease=true
            args="--current"
          else
            prerelease=false
            from="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "$TAG^" 2>/dev/null \
              || git rev-list --max-parents=0 "$TAG" | tail -1)"
            args="--ignore-tags - $from..$TAG"
          fi
          {
            echo "prerelease=$prerelease"
            echo "args=$args --strip header"
          } >> "$GITHUB_OUTPUT"

      # Missing notes should not block a release; the next step falls back to a placeholder.
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        continue-on-error: true
        with:
          version: v2.14.2
          config: cliff.toml
          args: ${{ steps.range.outputs.args }}
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md

      - name: Finalize release notes
        env:
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          if [[ ! -s "$NOTES" ]]; then
            echo "::warning::git-cliff failed; publishing without generated notes"
            echo "Release notes could not be generated." > "$NOTES"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ steps.range.outputs.prerelease }}
          make_latest: ${{ steps.range.outputs.prerelease == 'true' && 'false' || 'true' }}
